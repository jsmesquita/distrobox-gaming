---
# melonDS standalone: seed config + local BIOS/firmware copies.
# Seed-only-if-missing everywhere: the toml accumulates user state
# (window geometry, joystick mapping) and melonDS mutates the
# firmware file with user settings.

- name: Ensure melonDS directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dg_melonds_config_dir }}"
    - "{{ dg_melonds_config_dir }}/bios"

- name: Check DS BIOS/firmware in the BIOS root
  # melonDS falls back to its built-in FreeBIOS, so absent dumps are fine.
  ansible.builtin.stat:
    path: "{{ dg_bios_root }}/{{ item }}"
  loop: "{{ dg_melonds_bios_files }}"
  register: _melonds_bios

- name: Copy DS BIOS/firmware from the BIOS root (seed only if missing)
  ansible.builtin.copy:
    src: "{{ dg_bios_root }}/{{ item.item }}"
    dest: "{{ dg_melonds_config_dir }}/bios/{{ item.item }}"
    remote_src: true
    force: false
    mode: "0644"
  loop: "{{ _melonds_bios.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: Seed melonDS config (seed only if missing)
  ansible.builtin.template:
    src: melonDS.toml.j2
    dest: "{{ dg_melonds_config_dir }}/melonDS.toml"
    force: false
    mode: "0644"
