---
- name: Ensure Cemu config directory exists
  ansible.builtin.file:
    path: "{{ dg_box_home }}/.config/Cemu"
    state: directory
    mode: "0755"

# force: false — Cemu mutates settings.xml at runtime (window position,
# game cache, recent files). Re-running the playbook after Cemu has
# written its own state would clobber that user data. Only seed if absent.
- name: Deploy Cemu baseline settings.xml (seed only if missing)
  ansible.builtin.template:
    src: cemu-settings.xml.j2
    dest: "{{ dg_box_home }}/.config/Cemu/settings.xml"
    force: false
    mode: "0644"

- name: Ensure Cemu controllerProfiles directory exists
  ansible.builtin.file:
    path: "{{ dg_box_home }}/.config/Cemu/controllerProfiles"
    state: directory
    mode: "0755"

# Captured from Cemu's GUI after mapping an 8BitDo Ultimate 2
# (SDLController API, Wii U Pro Controller); the pad identity comes from
# dg_controller_sdl_guid/name. Seed only if missing so in-GUI remapping
# survives reset-configs runs. One profile per player; Cemu tells identical
# pads apart by the "<n>_" uuid prefix.
- name: Seed Cemu controller profiles
  ansible.builtin.template:
    src: cemu-controller.xml.j2
    dest: "{{ dg_box_home }}/.config/Cemu/controllerProfiles/controller{{ cemu_pad_index }}.xml"
    force: false
    mode: "0644"
  loop: "{{ range(dg_controller_players | int) | list }}"
  loop_control:
    loop_var: cemu_pad_index
