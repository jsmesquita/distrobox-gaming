---
# RetroArch config enforcement.
#
# We don't template the full retroarch.cfg (it's ~114 KB and almost
# every key represents a user-facing UI preference we want them to be
# able to change freely). Instead, we surgically enforce just the few
# settings this stack depends on (dg_retroarch_settings: audio driver,
# menu buttons, fullscreen), leaving everything else to RetroArch itself.

- name: Ensure RetroArch config directory exists
  ansible.builtin.file:
    path: "{{ dg_retroarch_dir }}"
    state: directory
    mode: "0755"

- name: Enforce critical RetroArch settings in retroarch.cfg
  # Each entry rewrites the line for `key`. RetroArch's UI may flip
  # these values during a session, but they reset to our enforced
  # value on the next reset-configs run.
  #
  # On a fresh box retroarch.cfg doesn't exist yet (RetroArch writes it
  # on first launch), so create it holding just these keys. RetroArch
  # fills every missing key with its defaults when it loads the file and
  # keeps ours when it saves the full config on exit, so a from-scratch
  # setup gets the enforced values without a second reset-configs run.
  ansible.builtin.lineinfile:
    path: "{{ dg_retroarch_config }}"
    regexp: '^{{ item.key }}\s*='
    line: '{{ item.key }} = {{ item.value }}'
    create: true
    backup: true
    mode: "0644"
  loop: "{{ dg_retroarch_settings }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"

- name: Ensure RetroArch core option directories exist
  ansible.builtin.file:
    path: "{{ item.path | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ dg_retroarch_core_options | default([]) }}"
  loop_control:
    label: "{{ item.path | dirname }}"

- name: Enforce critical RetroArch core options
  ansible.builtin.lineinfile:
    path: "{{ item.0.path }}"
    regexp: '^{{ item.1.key }}\s*='
    line: '{{ item.1.key }} = {{ item.1.value }}'
    create: true
    backup: true
    mode: "0644"
  loop: "{{ (dg_retroarch_core_options | default([])) | subelements('settings') }}"
  loop_control:
    label: "{{ item.0.path }}: {{ item.1.key }} = {{ item.1.value }}"
