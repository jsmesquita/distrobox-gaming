---
# Install RetroArch buildbot cores and asset packs.
# Cores are downloaded as .zip and unpacked into ~/.config/retroarch/cores/.
# Assets are downloaded and unpacked into their respective subdirectories.
# get_url with skip-if-exists keeps this idempotent.

- name: Ensure RetroArch directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dg_retroarch_dir }}"
    - "{{ dg_retroarch_dir }}/cores"
    - "{{ dg_retroarch_cache_dir }}"

# Cores: only download if the unpacked .so doesn't exist yet.

- name: Stat installed RetroArch cores
  ansible.builtin.stat:
    path: "{{ dg_retroarch_dir }}/cores/{{ item }}_libretro.so"
  loop: "{{ dg_retroarch_cores }}"
  register: _core_stat
  loop_control:
    label: "{{ item }}"

# The buildbot is often slow or drops connections. Retry each core, keep
# going past failures so the rest still install, and fail clearly at the
# end (below) instead of silently leaving ES-DE pointing at missing cores.
- name: Download missing RetroArch buildbot cores
  ansible.builtin.get_url:
    url: "{{ dg_retroarch_buildbot }}/nightly/linux/x86_64/latest/{{ item.item }}_libretro.so.zip"
    dest: "{{ dg_retroarch_cache_dir }}/{{ item.item }}_libretro.so.zip"
    mode: "0644"
    timeout: "{{ dg_retroarch_download_timeout }}"
    force: false
  loop: "{{ _core_stat.results }}"
  when: not item.stat.exists
  register: _core_dl
  until: _core_dl is succeeded
  retries: "{{ dg_retroarch_download_retries }}"
  delay: 10
  ignore_errors: true
  loop_control:
    label: "{{ item.item }}"

- name: Extract RetroArch cores
  ansible.builtin.unarchive:
    src: "{{ dg_retroarch_cache_dir }}/{{ item.item.item }}_libretro.so.zip"
    dest: "{{ dg_retroarch_dir }}/cores/"
    remote_src: true
    creates: "{{ dg_retroarch_dir }}/cores/{{ item.item.item }}_libretro.so"
  loop: "{{ _core_dl.results }}"
  when: item is not skipped and item is succeeded
  loop_control:
    label: "{{ item.item.item }}"

- name: Clear executable-stack flag on all installed cores
  # Some buildbot cores (melonds among them) ship with an executable
  # GNU_STACK program header. glibc 2.41+ refuses to dlopen such
  # libraries ("cannot enable executable stack as shared object
  # requires: Invalid argument"), so RetroArch fails to load the core
  # and exits instantly — in ES-DE that looks like the game silently
  # not launching. Clearing the flag is safe: it comes from asm objects
  # missing a .note.GNU-stack marker, not a real requirement. Sweeps
  # every core (including ones installed via RetroArch's GUI updater)
  # so future downloads stay covered.
  ansible.builtin.shell: |
    {{ dg_in_box }} sh -c '
      fixed=0
      for c in "{{ dg_retroarch_dir }}/cores"/*.so; do
        [ -e "$c" ] || continue
        if readelf -lW "$c" 2>/dev/null | grep -q "GNU_STACK.*RWE"; then
          patchelf --clear-execstack "$c" && fixed=$((fixed+1))
        fi
      done
      echo "execstack-cleared: $fixed"
    '
  register: _core_execstack
  changed_when: "'execstack-cleared: 0' not in _core_execstack.stdout"

# Assets: stamp file marks completion so re-runs skip the whole download/extract.

- name: Ensure RetroArch asset directories exist
  ansible.builtin.file:
    path: "{{ dg_retroarch_dir }}/{{ item.dir }}"
    state: directory
    mode: "0755"
  loop: "{{ dg_retroarch_assets }}"
  loop_control:
    label: "{{ item.dir }}"

- name: Stat asset stamp files
  ansible.builtin.stat:
    path: "{{ dg_retroarch_dir }}/{{ item.dir }}/.dg-installed"
  loop: "{{ dg_retroarch_assets }}"
  register: _asset_stamp
  loop_control:
    label: "{{ item.dir }}"

- name: Download missing RetroArch asset packs
  ansible.builtin.get_url:
    url: "{{ dg_retroarch_buildbot }}/assets/frontend/{{ item.item.zip }}"
    dest: "{{ dg_retroarch_cache_dir }}/{{ item.item.zip }}"
    mode: "0644"
    timeout: "{{ dg_retroarch_download_timeout }}"
    force: false
  loop: "{{ _asset_stamp.results }}"
  when: not item.stat.exists
  register: _asset_dl
  until: _asset_dl is succeeded
  retries: "{{ dg_retroarch_download_retries }}"
  delay: 10
  ignore_errors: true
  loop_control:
    label: "{{ item.item.zip }}"

- name: Extract RetroArch asset packs
  ansible.builtin.unarchive:
    src: "{{ dg_retroarch_cache_dir }}/{{ item.item.item.zip }}"
    dest: "{{ dg_retroarch_dir }}/{{ item.item.item.dir }}/"
    remote_src: true
  loop: "{{ _asset_dl.results }}"
  when: item is not skipped and item is succeeded
  loop_control:
    label: "{{ item.item.item.zip }}"

- name: Mark asset packs as installed
  ansible.builtin.copy:
    content: "Installed by Ansible. Delete to force re-extraction.\n"
    dest: "{{ dg_retroarch_dir }}/{{ item.item.item.dir }}/.dg-installed"
    mode: "0644"
  loop: "{{ _asset_dl.results }}"
  when: item is not skipped and item is succeeded
  loop_control:
    label: "{{ item.item.item.dir }}"

- name: Fail if any RetroArch core or asset pack could not be downloaded
  ansible.builtin.fail:
    msg: >-
      Could not download from {{ dg_retroarch_buildbot }} after
      {{ dg_retroarch_download_retries }} retries.
      Cores: {{ _core_dl.results | select('failed') | map(attribute='item.item') | list | join(', ') or 'none' }}.
      Asset packs: {{ _asset_dl.results | select('failed') | map(attribute='item.item.zip') | list | join(', ') or 'none' }}.
      Everything else was installed; re-run `ansible-playbook site.yml --tags retroarch`
      to fetch only what is missing.
  when: >-
    (_core_dl.results | select('failed') | list | length > 0) or
    (_asset_dl.results | select('failed') | list | length > 0)
