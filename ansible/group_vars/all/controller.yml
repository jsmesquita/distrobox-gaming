# The physical gamepad that emulators binding a SPECIFIC device are seeded
# for: Dolphin (GCPad/Wiimote "Device = SDL/0/<name>"), Cemu (controller
# profile uuid + display name) and Azahar (SDL guid). The button bindings
# themselves use SDL's generic gamecontroller names / xpad indices, so a
# different XInput-style pad only needs its identity here. Emulators that
# take "the first pad" (PCSX2, DuckStation, PPSSPP, RetroArch, Flycast,
# xemu, Supermodel) need nothing.
#
# Read both values from SDL inside the box with the pad connected:
#   distrobox enter gaming -- python3 -I scripts/sdl-pad-ids.py
# The verify role warns when no connected pad matches.
# Defaults: 8BitDo Ultimate 2 (2dc8:310b) in XInput mode.
dg_controller_sdl_name: "8BitDo Ultimate 2 Wireless Controller"
dg_controller_sdl_guid: "0300f6b6c82d00000b31000014010000"

# Local multiplayer: how many identical pads (same name/guid, told apart by
# SDL index 0, 1, ...) get bindings in Dolphin (GC + Wii), Cemu, PCSX2 and
# DuckStation. Player 1 is whichever pad SDL enumerated first. RetroArch,
# Steam/Wine games and most native ports pick up extra pads on their own.
dg_controller_players: 1

# DuckStation bindings for every player ("SDL-<n>/<name>", n = player - 1).
# Same mapping as PCSX2's [Pad1]: Xbox A/B/X/Y = Cross/Circle/Square/Triangle,
# Guide toggles analog mode.
dg_duckstation_pad_options:
  - { option: Type, value: AnalogController }
  # A DualShock powers on in DIGITAL mode, where both sticks are dead until
  # Analog (Guide) is pressed. Start in analog mode, and for digital-only
  # games let the left stick drive the d-pad.
  - { option: ForceAnalogOnReset, value: "true" }
  - { option: AnalogDPadInDigitalMode, value: "true" }
dg_duckstation_pad_bindings:
  - { option: Up, bind: DPadUp }
  - { option: Down, bind: DPadDown }
  - { option: Left, bind: DPadLeft }
  - { option: Right, bind: DPadRight }
  - { option: Cross, bind: A }
  - { option: Circle, bind: B }
  - { option: Square, bind: X }
  - { option: Triangle, bind: Y }
  - { option: L1, bind: LeftShoulder }
  - { option: R1, bind: RightShoulder }
  - { option: L2, bind: +LeftTrigger }
  - { option: R2, bind: +RightTrigger }
  - { option: L3, bind: LeftStick }
  - { option: R3, bind: RightStick }
  - { option: Select, bind: Back }
  - { option: Start, bind: Start }
  - { option: Analog, bind: Guide }
  - { option: LUp, bind: -LeftY }
  - { option: LDown, bind: +LeftY }
  - { option: LLeft, bind: -LeftX }
  - { option: LRight, bind: +LeftX }
  - { option: RUp, bind: -RightY }
  - { option: RDown, bind: +RightY }
  - { option: RLeft, bind: -RightX }
  - { option: RRight, bind: +RightX }
  - { option: SmallMotor, bind: SmallMotor }
  - { option: LargeMotor, bind: LargeMotor }
